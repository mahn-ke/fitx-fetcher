version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/fitx-fetcher:latest@sha256:c745bbe848e63e03ad2764ccb3ba2bc31b4572ef22bd161c784adfa4493f96b8
    restart: unless-stopped
    environment:
      - RUN_AT_STARTUP=true
      - GCP_CREDENTIALS=${GCP_CREDENTIALS}
      - FITX_EMAIL=${FITX_EMAIL}
      - FITX_PASSWORD=${FITX_PASSWORD}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
