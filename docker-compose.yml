version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/fitx-fetcher:latest@sha256:9c3db17133181ac1425dbde70600f8963996cb94d8ca593605dee071a1362f42
    restart: unless-stopped
    environment:
      - RUN_AT_STARTUP=true
      - GCP_CREDENTIALS=${GCP_CREDENTIALS}
      - FITX_EMAIL=${FITX_EMAIL}
      - FITX_PASSWORD=${FITX_PASSWORD}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
